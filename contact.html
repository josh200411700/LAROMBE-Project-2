<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact | KCC</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-banner"><div class="container"><span class="eyebrow">Get in Touch</span><h1>Contact KCC</h1></div></section>
    <section class="section"><div class="container contact-grid">
      <div><span class="eyebrow dark">Admissions and Inquiries</span><h2>We would love to hear from you.</h2><p>Send us a message and our team will provide the information you need.</p>
        <div class="contact-list"><p><strong>Address</strong><br>Kabankalan City, Negros Occidental</p><p><strong>Email</strong><br>info@kcc.edu.ph</p><p><strong>Phone</strong><br>Available during office hours</p><p><strong>Facebook</strong><br><a class="contact-link" href="https://www.facebook.com/share/1AAuuP4sMT/" target="_blank" rel="noopener noreferrer">Visit our Facebook page</a></p></div>
      </div>
      <form class="contact-form" id="contactForm">
        <label>Full Name<input type="text" name="name" required></label>
        <label>Email Address<input type="email" name="email" required></label>
        <label>Interested Program<select name="program"><option>College Program</option><option>Senior High School</option><option>General Inquiry</option></select></label>
        <label>Message<textarea name="message" rows="5" required></textarea></label>
        <button class="btn btn-primary" type="submit">Send Inquiry</button><p class="form-status" role="status"></p>
      </form>
    </div></section>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/script.js"></script>
</body>
</html>
